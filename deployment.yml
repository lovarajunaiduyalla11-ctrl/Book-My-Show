apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-app
  labels:
    app: bms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bms
  template:
    metadata:
      labels:
        app: bms
    spec:
      imagePullSecrets:
        - name: docker-cred   # 👈 Add this line
      containers:
        - name: bms-container
          image: lova1254/bms:latest
          ports:
            - containerPort: 3000
